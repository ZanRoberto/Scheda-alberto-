<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24201c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scheda Alberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: allenatore che parla chiaro, energico ma ordinato
   IDEA: la scheda cartacea del trainer diventata un cartellino da palestra che si spunta
   PICTURE: la card dell'esercizio di oggi, con figura, obiettivo grande e pallini delle serie
   COLOUR and TYPE: le quattro strisce della scheda (sabbia, acqua, arancio, bruno) su fondo carta; Barlow Condensed
   LAYOUT: una colonna, pollice-friendly, barra recupero fissa in basso */
:root{color-scheme:light dark;--bg:light-dark(#f4f1ea,#141312);--card:light-dark(#fff,#1f1d1b);--ink:light-dark(#201e1b,#f2eee7);--mute:light-dark(#6a645b,#a39c91);--line:light-dark(#e2dccf,#35312c);--teal:light-dark(#178f87,#45c3b9);--teal-s:light-dark(#dff3f1,#173936);--or:light-dark(#d5671f,#f08a45);--or-s:light-dark(#fbe9dc,#3a2416);--head:#24201c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:110px}
h1,h2,h3,.big{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:6px}.stripe i:nth-child(1){background:#cdbb94}.stripe i:nth-child(2){background:#8fd3cf}.stripe i:nth-child(3){background:#e8a06b}.stripe i:nth-child(4){background:#5c4a3a}
header{background:var(--head);color:#f4efe6}
.hin{max-width:780px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px) 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hin h1{font-size:clamp(30px,6vw,42px);font-weight:800;flex:1}
.hin small{display:block;font:500 14px Barlow,sans-serif;color:#c9c0b2;margin-top:4px}
.hb{background:#ffffff14;border:1px solid #ffffff2a;border-radius:10px;min-height:44px;padding:0 14px;color:#f4efe6}
main{max-width:780px;margin:auto;padding:18px max(4vw,16px)}
.today{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.today .big{font-size:clamp(34px,8vw,52px);font-weight:800}
.today .big em{font-style:normal;color:var(--or)}
.go{background:var(--or);color:#fff;border:0;border-radius:14px;min-height:56px;font:700 22px "Barlow Condensed",sans-serif;letter-spacing:.3px}
.mbar{display:flex;align-items:center;gap:8px;margin:26px 0 10px}
.mbar h2{font-size:26px;flex:1}
.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch}
.grid .wk{font:700 18px "Barlow Condensed",sans-serif;align-self:center;padding-right:4px;color:var(--mute)}
.cell{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:74px;padding:10px 12px;text-align:left;display:grid;align-content:space-between}
.cell b{font:700 19px "Barlow Condensed",sans-serif}
.cell span{font-size:14px;color:var(--mute)}
.cell.ok{background:var(--teal-s);border-color:var(--teal)}.cell.ok span{color:var(--teal);font-weight:600}
.cell.next{border:2px solid var(--or);box-shadow:0 4px 0 var(--or-s)}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 14px}
.log{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
.log time{color:var(--mute);white-space:nowrap}
/* sessione */
.shead{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.shead h2{font-size:clamp(28px,6vw,38px);flex:1}
.sec{font:700 15px Barlow,sans-serif;color:var(--mute);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.circ{background:var(--or-s);color:var(--or);border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px;margin:14px 0 8px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;transition:opacity .2s}
.ex.mob{grid-template-columns:minmax(0,1fr)}
.ex.noimg{grid-template-columns:minmax(0,1fr)}
.ex.done{border-color:var(--teal);background:linear-gradient(var(--teal-s),var(--card) 60%)}
.pic{background:#fff;border-radius:12px;border:0;padding:4px;display:grid;place-items:center;align-self:start}
.pic img{width:100%;height:auto;display:block}
.ex h3{font-size:24px;font-weight:700}
.ex.mob h3{font-size:20px}
.tgt{font:800 clamp(30px,7vw,38px)/1 "Barlow Condensed",sans-serif;margin:8px 0 6px;color:var(--or)}
.ex.mob .tgt{font-size:26px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:14px;font-weight:600;border-radius:8px;padding:3px 9px;background:var(--bg);border:1px solid var(--line)}
.tag.w{background:var(--teal-s);border-color:transparent;color:var(--teal)}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;font:700 17px "Barlow Condensed",sans-serif;color:var(--mute)}
.dot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.fatto{margin-left:auto;border:2px solid var(--teal);color:var(--teal);background:transparent;border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.done .fatto{background:var(--teal);color:#fff}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--mute);min-height:32px;display:flex;align-items:center}
.desc{margin:6px 0 10px;font-size:15.5px}
.lvl{display:grid;gap:8px;margin-top:6px}
.lvl label{font-size:13px;color:var(--mute);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{background:var(--or-s);border-radius:12px;padding:12px;margin-top:10px;display:grid;gap:8px}
.prog p{margin:0;font-size:15px}
.prog .row button{border:0;border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.prog .row button.pri{background:var(--or);color:#fff;border-color:var(--or)}
.banner{background:var(--teal);color:#fff;border-radius:16px;padding:16px;margin:16px 0;font-weight:600}
.banner b{font:800 26px "Barlow Condensed",sans-serif;display:block}
/* timer */
#tmr{position:fixed;left:0;right:0;bottom:0;background:var(--head);color:#fff;transform:translateY(110%);transition:transform .25s,visibility .25s;z-index:5;visibility:hidden}
#tmr.on{transform:none;visibility:visible}
#tmr .in{max-width:780px;margin:auto;padding:10px max(4vw,16px) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
#tmr .t{font:800 40px/1 "Barlow Condensed",sans-serif;min-width:94px;font-variant-numeric:tabular-nums}
#tmr .l{flex:1;font-size:14px;color:#cfc6b8}
#tmr .l .meter{background:#ffffff26;margin-top:6px}#tmr .l .meter i{background:#e8a06b}
#tmr button{background:#ffffff18;border:1px solid #ffffff30;color:#fff;border-radius:10px;min-height:44px;min-width:48px;font-weight:700}
#tmr.end .t{color:#8fd3cf}
/* overlay */
#ov{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:9;padding:16px}
#ov.on{display:grid}#ov img{max-width:100%;max-height:85vh;background:#fff;border-radius:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.card h3{font-size:22px;margin-bottom:6px}.card p{margin:6px 0}
textarea{width:100%;min-height:120px;font:14px ui-monospace,monospace;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.note{font-size:13px;color:var(--mute)}
.inst{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:2px solid var(--teal);border-radius:18px;padding:14px;margin-bottom:14px}.inst img{width:56px;height:56px;border-radius:14px}.inst>div>b{display:block;font:700 20px 'Barlow Condensed',sans-serif}.inst span{display:block;font-size:15px;color:var(--mute);line-height:1.45}.inst span b{color:var(--ink)}.inst .row{grid-column:1/-1}.inst .go{flex:1;min-height:48px;font-size:20px}
#tmr .in{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
@media(max-width:560px){.ex{grid-template-columns:minmax(0,1fr)}.pic{max-width:260px}.grid{grid-template-columns:auto 1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header><div class="stripe"><i></i><i></i><i></i><i></i></div>
<div class="hin"><h1 id="ttl">Scheda di Alberto<small id="sub">Scheda provvisoria personalizzata</small></h1>
<button class="hb" id="hbHome" hidden>‹ Scheda</button><button class="hb" id="hbLeg">Legenda</button></div></header>
<main id="app"></main>
<div id="tmr"><div class="in"><div class="t" id="tT">0:00</div><div class="l"><span id="tL">Recupero</span><div class="meter"><i id="tM"></i></div></div><button id="tMinus">−15</button><button id="tPlus">+15</button><button id="tX" aria-label="Chiudi recupero">✕</button></div></div>
<div id="ov"><img id="ovImg" alt=""></div>

const exLog=(g,id)=>g.x[id]||(g.x[id]={n:0,ok:0});
const fmtD=t=>new Date(t).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
function stat(m,s){const g=S.log[sk(m,s.w,s.d)];const it=items(s);const dn=g?it.filter(e=>g.x[e.id]?.ok).length:0;return{dn,tot:it.length,closed:g?.closed}}

 [1,2,3,4].forEach(w=>{h+=`<div class="wk">Sett. ${w}</div>`;[1,2].forEach(d=>{const s=P.find(x=>x.w===w&&x.d===d),st=stat(m,s),g=S.log[sk(m,w,d)];const nxt=m===S.month&&nx===s;

 h+=`</div>`;
 const reg=Object.entries(S.log).filter(([k,g])=>g.closed).sort((a,b)=>b[1].closed-a[1].closed).slice(0,12);
 h+=`<div class="sec">Registro</div>`+(reg.length?`<ul class="log">${reg.map(([k,g])=>{const[,mm,ww,dd]=k.match(/m(\d+)w(\d+)d(\d+)/);return`<li><span>Mese ${mm} · Sett. ${ww} · Giorno ${dd}</span><time>${fmtD(g.closed)}</time></li>`}).join('')}</ul>`:`<p class="note">Qui compariranno gli allenamenti chiusi, con la data.</p>`);
 h+=`<div class="sec">Ricomincia</div>`+(S.prev?`<div class="prog"><p><b>Scheda azzerata.</b> Ti sei sbagliato? Puoi tornare a com’era prima.</p><div class="row"><button class="pri" id="rsUndo">Annulla l’azzeramento</button></div></div>`:'')+`<div class="row" style="margin-top:8px"><button class="ghost" id="rsM">Azzera il mese ${S.month}</button><button class="ghost" id="rsAll">Ricomincia la scheda da capo</button></div><div id="rsBox"></div>`;

function card(e,g,m){
 const l=lv(e),xl=g.x[e.id]||{n:0,ok:0},ns=e.s[l.s],im=e.img&&IMG[e.img];
 let h=e.circ?`<div class="circ">${esc(e.circ)}</div>`:'';
 h+=`<article class="ex ${e.mob?'mob':''} ${im?'':'noimg'} ${xl.ok?'done':''}" id="x-${e.id}">`;
 if(im)h+=`<button class="pic" data-zoom="${e.img}" aria-label="Ingrandisci figura"><img src="${im}" alt="${esc(e.n)}"></button>`;
 h+=`<div><h3>${esc(e.n)}</h3><div class="tgt">${esc(tgt(e,l))}</div><div class="tags">${e.w.length?`<span class="tag w">${esc(e.w[l.w])}</span>`:''}${e.rest?`<span class="tag">Pausa ${e.rest[l.q]}</span>`:''}</div>`;
 h+=`<div class="sets">${Array.from({length:ns},(_,i)=>`<button class="dot ${i<xl.n?'on':''}" data-set="${e.id}" data-i="${i}" aria-label="Serie ${i+1}">${i+1}</button>`).join('')}<button class="fatto" data-ok="${e.id}">${xl.ok?'✓ Fatto':'Fatto'}</button></div>`;
 const pend=m>1&&l.m<m&&m===S.month;
 h+=pend?prog(e,l,m,true):'';
 h+=`<details ${pend?'':''}><summary>Come si fa e livello</summary><p class="desc">${esc(e.d)}</p><div class="lvl">`;
 if(e.w.length>1)h+=`<label>${e.w.some(x=>/kg/.test(x))?'Peso / variante':'Variante'}</label><div class="chips">${e.w.map((x,i)=>`<button class="chip ${i===l.w?'on':''}" data-lv="${e.id}" data-k="w" data-v="${i}">${esc(x)}</button>`).join('')}</div>`;
 if(e.r.length>1)h+=`<label>Ripetizioni</label><div class="chips">${e.r.map((x,i)=>`<button class="chip ${i===l.r?'on':''}" data-lv="${e.id}" data-k="r" data-v="${i}">${esc(x)}</button>`).join('')}</div>`;
 if(e.s.length>1)h+=`<label>Serie</label><div class="chips">${e.s.map((x,i)=>`<button class="chip ${i===l.s?'on':''}" data-lv="${e.id}" data-k="s" data-v="${i}">${x}</button>`).join('')}</div>`;
 if(e.rest)h+=`<label>Recupero (si parte dal più lungo; se ti blocchi, accorcialo a parità di carico)</label><div class="chips">${e.rest.map((x,i)=>`<button class="chip ${i===l.q?'on':''}" data-lv="${e.id}" data-k="q" data-v="${i}">${x}</button>`).join('')}</div>`;
 h+=`</div>${pend?'':prog(e,l,m,false)}</details></div></article>`;
 return h;
}
function prog(e,l,m,pend){

 let b='';
 if(nr)b+=`<button class="pri" data-pg="${e.id}" data-t="r">Vera: ${esc(v)}</button>`;
 if(nsx)b+=`<button class="${nr?'':'pri'}" data-pg="${e.id}" data-t="s">Accompagnata: ${esc(a)}</button>`;
 if(!nr&&!nsx){p+=`<p>Progressione finita a questo livello.${nw?' Sali di peso e riparti dalle ripetizioni più basse.':' Chiedi al trainer il passo successivo.'}</p>`;if(nw)b+=`<button class="pri" data-pg="${e.id}" data-t="w">Sali a ${esc(e.w[l.w+1])}</button>`}
 if(pend)b+=`<button data-pg="${e.id}" data-t="k">Resto così</button>`;
 return `<div class="prog">${p}<div class="row">${b}</div></div>`;
}
function session(){
 const m=view.m??S.month,s=P.find(x=>x.w===view.w&&x.d===view.d),g=sess(m,s.w,s.d),st=stat(m,s);
 let h=`<div class="shead"><h2>Settimana ${s.w} · Giorno ${s.d}</h2><span class="note">Mese ${m}</span></div><div class="meter"><i style="width:${st.dn/st.tot*100}%"></i></div><p class="note">${st.dn} di ${st.tot} fatti · tocca un pallino a fine serie: parte il recupero.</p>`;
 if(st.closed)h+=`<div class="banner"><b>Allenamento completato</b>Chiuso ${fmtD(g.closed)}. Ottimo lavoro.</div>`;
 h+=`<div class="sec">Mobilità e riscaldamento · pausa 15-30″</div>`+s.mob.map(e=>card(e,g,m)).join('');
 h+=`<div class="sec">Allenamento</div>`+s.ex.map(e=>card(e,g,m)).join('');
 const i=P.indexOf(s);h+=`<div class="row" style="margin-top:18px">${i>0?`<button class="ghost" data-open="${P[i-1].w}-${P[i-1].d}">‹ Giorno precedente</button>`:''}${i<P.length-1?`<button class="ghost" data-open="${P[i+1].w}-${P[i+1].d}" style="margin-left:auto">Giorno successivo ›</button>`:''}</div>`;
 app.innerHTML=h;
}
function legend(){
 app.innerHTML=`<div class="card"><h3>Come leggere un esercizio</h3><p><b>6/8/10 × 5 · pausa 2′-1′</b> = ripetizioni × serie, poi il recupero.</p><p>BW = corpo libero. Zav = con sovraccarico del peso indicato.</p><p>Presa neutra: anelli paralleli. Prona: palmo in avanti. Supina: palmo verso di te.</p></div>
<div class="card"><h3>La progressione con lo “/”</h3><p>Esempio <b>1/3/5 × 5/7</b>. Mese 1: 1×5. Mese 2 scegli in base alla fatica: <b>3×5</b> (progressione vera) oppure <b>1×7</b> (accompagnata). Mese 3: 5×5 oppure 3×7. Mese 4: se non ti senti pronto al peso nuovo, fai l’ultima accompagnata rimasta, 5×7.</p><p>Se un esercizio è troppo duro da far salire di ripetizioni, aumenta prima le serie e poi le ripetizioni.</p><p>Arrivato al massimo di ripetizioni e serie, alza il peso o la variante e riparti dalle ripetizioni più basse.</p><p class="note">Nell’app: a ogni mese nuovo ogni esercizio ti chiede Vera, Accompagnata o Resto così.</p></div>
<div class="card"><h3>Recupero a scalare</h3><p>Con 2′30″-1′30″ parti dal recupero più lungo. Se ti blocchi in una progressione, prima accorci il recupero a parità di carico, poi passi alla progressione successiva.</p></div>
<div class="card"><h3>Mobilità</h3><p>Negli esercizi di mobilità e riscaldamento iniziali il recupero tra le serie è sempre 15-30″.</p></div>
<div class="card"><h3>Livelli di partenza</h3><p class="note">I valori proposti all’inizio sono quelli evidenziati in grassetto nella scheda provvisoria. Puoi cambiarli in “Come si fa e livello”.</p></div>`;
}
function render(){
 document.getElementById('hbHome').hidden=view.name==='home';
 document.getElementById('hbLeg').hidden=view.name==='leg';
 document.getElementById('sub').textContent=view.name==='leg'?'Legenda della scheda':`Mese ${S.month} in corso`;
 view.name==='home'?home():view.name==='leg'?legend():session();
}
const go=(name,extra={})=>{view={...view,name,...extra};render();scrollTo(0,0)};
/* --- timer di recupero --- */
const tm=document.getElementById('tmr'),tT=document.getElementById('tT'),tL=document.getElementById('tL'),tM=document.getElementById('tM');
let T=null,iv=null,ac=null;
const secs=t=>{const m=t.match(/(\d+)′/),s=t.match(/(\d+)″/);return(m?+m[1]*60:0)+(s?+s[1]:0)};
function beep(){try{ac=ac||new AudioContext();[0,.25,.5].forEach(o=>{const os=ac.createOscillator(),g=ac.createGain();os.frequency.value=880;g.gain.value=.15;os.connect(g);g.connect(ac.destination);os.start(ac.currentTime+o);os.stop(ac.currentTime+o+.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startT(sec,label){try{ac=ac||new AudioContext()}catch(e){}T={end:Date.now()+sec*1000,tot:sec,label,rung:0};tm.classList.add('on');tm.classList.remove('end');clearInterval(iv);iv=setInterval(tick,250);tick()}
function tick(){if(!T)return;const r=Math.max(0,Math.round((T.end-Date.now())/1000));tT.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');tM.style.width=(100-r/T.tot*100)+'%';tL.textContent=r?'Recupero · '+T.label:'Vai con la prossima serie';if(!r&&!T.rung){T.rung=1;tm.classList.add('end');beep()}}
document.getElementById('tMinus').onclick=()=>{if(T){T.end-=15000;tick()}};
document.getElementById('tPlus').onclick=()=>{if(T){T.end+=15000;T.tot+=15;T.rung=0;tm.classList.remove('end');tick()}};
document.getElementById('tX').onclick=()=>{T=null;clearInterval(iv);tm.classList.remove('on')};
/* --- eventi --- */
document.getElementById('hbHome').onclick=()=>go('home',{m:view.name==='sess'?view.m:null});
document.getElementById('hbLeg').onclick=()=>go('leg');
const ov=document.getElementById('ov');ov.onclick=()=>ov.classList.remove('on');
function curSess(){const m=view.m??S.month;const s=P.find(x=>x.w===view.w&&x.d===view.d);return{m,s,g:sess(m,s.w,s.d)}}
function checkClose(){const{m,s,g}=curSess();const all=items(s).every(e=>g.x[e.id]?.ok);if(all&&!g.closed)g.closed=Date.now();if(!all&&g.closed)delete g.closed}
app.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.open){const[w,dd]=d.open.split('-').map(Number);go('sess',{w,d:dd,m:view.m});return}
 if(b.id==='mPrev'){view.m=(view.m??S.month)-1;render();return}
 if(b.id==='mNext'){const n=(view.m??S.month)+1;view.m=n>=S.month?null:n;render();return}
 if(b.id==='newM'){S.month++;view.m=null;save();render();return}
 if(d.zoom){document.getElementById('ovImg').src=IMG[d.zoom];ov.classList.add('on');return}
 if(d.set){const e=ALL[d.set],{g}=curSess(),x=exLog(g,e.id),i=+d.i,ns=e.s[lv(e).s];
  if(i<x.n){x.n=i}else{x.n=i+1;const rest=e.rest?e.rest[lv(e).q]:null;if(x.n<ns&&rest)startT(secs(rest),e.n);else if(x.n<ns&&e.circ)startT(30,'cambio esercizio')}
  x.ok=x.n>=ns?1:0;checkClose();save();render();return}
 if(d.ok){const e=ALL[d.ok],{g}=curSess(),x=exLog(g,e.id);x.ok=x.ok?0:1;if(x.ok)x.n=e.s[lv(e).s];checkClose();save();render();
  if(x.ok){const nx=document.querySelector('.ex:not(.done)');nx&&nx.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'})}return}
 if(d.lv){const e=ALL[d.lv];setLv(e,{[d.k]:+d.v});render();const c=document.getElementById('x-'+e.id);c&&c.querySelector('details')?.setAttribute('open','');return}
 if(d.pg){const e=ALL[d.pg],l=lv(e),m=S.month;const p={m};if(d.t==='r')p.r=l.r+1;if(d.t==='s')p.s=l.s+1;if(d.t==='w'){p.w=l.w+1;p.r=0;p.s=0;p.q=0}setLv(e,p);render();return}
 if(b.id==='rsM'||b.id==='rsAll'){const all=b.id==='rsAll';document.getElementById('rsBox').innerHTML=`<div class="prog"><p>${all?'<b>Ricominci da capo:</b> si torna al mese 1, settimana 1, con i livelli di partenza del trainer. Il registro viene svuotato.':`<b>Azzeri il mese ${S.month}:</b> tutti i segni “fatto” di questo mese spariscono e riparti dalla settimana 1. I livelli raggiunti restano.`}</p><div class="row"><button class="pri" id="${all?'rsAllGo':'rsMGo'}">Sì, azzera</button><button id="rsNo">No, lascia così</button></div></div>`;return}
 if(b.id==='rsNo'){document.getElementById('rsBox').innerHTML='';return}
 if(b.id==='rsMGo'||b.id==='rsAllGo'){const{prev,...old}=S;const keep=JSON.parse(JSON.stringify(old));
  if(b.id==='rsAllGo')S={month:1,lv:{},log:{},at:0};else{Object.keys(S.log).forEach(k=>{if(k.startsWith('m'+S.month+'w'))delete S.log[k]})}
  S.prev=keep;view={name:'home',m:null,w:1,d:1};T=null;clearInterval(iv);tm.classList.remove('on');save();render();return}
 if(b.id==='rsUndo'){S={...S.prev};view.m=null;save();render();return}
 if(b.id==='instGo'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()});return}
 if(b.id==='instX'){hideInst=true;render();return}
 if(b.id==='bkC'){const t=JSON.stringify(S);const box=document.getElementById('bkBox');navigator.clipboard?.writeText(t).then(()=>{box.innerHTML='<p class="note">Backup copiato. Incollalo in una nota o in un messaggio a te stesso.</p>'},()=>{box.innerHTML='<p class="note">Copia questo testo:</p><textarea readonly>'+esc(t)+'</textarea>'});return}
 if(b.id==='bkR'){document.getElementById('bkBox').innerHTML='<textarea id="bkT" placeholder="Incolla qui il backup"></textarea><div class="row" style="margin-top:8px"><button class="ghost" id="bkGo">Ripristina</button></div>';return}
 if(b.id==='bkGo'){try{const d2=JSON.parse(document.getElementById('bkT').value);if(!d2.log||!d2.month)throw 0;S={...S,...d2};save();view.m=null;render()}catch(e){document.getElementById('bkBox').insertAdjacentHTML('beforeend','<p class="note">Il testo incollato non è un backup valido.</p>')}return}
});
render();
}
</script>
